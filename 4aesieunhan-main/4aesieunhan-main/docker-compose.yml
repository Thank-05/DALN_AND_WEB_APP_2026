# Chạy: docker compose up -d --build
# Lần đầu nạp dữ liệu mẫu: docker compose exec app php artisan db:seed --force
services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-cinema}
      MYSQL_USER: ${DB_USERNAME:-cinema}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Cần đặt DB_PASSWORD trong .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Cần đặt DB_ROOT_PASSWORD trong .env}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
    ports:
      - "10000:10000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
